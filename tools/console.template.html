<style>
  html, body { margin:0; padding:0; background-color:#0F0F0E; color:#F5F5F0; font-feature-settings:"cv02","cv03","cv04","cv11","tnum"; }

<script>
const RUNS = __RUNS_DATA__;

function metaFor(run){
  const s = run.summary || {};
  const roles = run.roles || {};
  const roleNames = Object.keys(roles);
  const builderLike = roleNames.find(r => r === "builder" || r === "worker") || "builder";
  const criticLike  = roleNames.find(r => r === "critic" || r === "orchestrator") || null;
  return {
    title: run.label,
    gate: run.gate,
    model: criticLike && s.criticModel && !/^none/.test(s.criticModel) ? `${s.builderModel} / ${s.criticModel}` : (s.builderModel || s.model || "?"),
    builderTools: (roles[builderLike] && roles[builderLike].tools) || ["read","bash","edit","write","ls","grep","find","send_mail"],
    criticTools: criticLike ? ((roles[criticLike] && roles[criticLike].tools) || ["send_mail"]) : [],
    builderRole: builderLike === "worker" ? "worker: builds what the orchestrator briefs" : "implements against a spec it doesn't have",
    criticRole: criticLike === "orchestrator" ? "orchestrator: decomposes, delegates, probes, claims done" : (criticLike ? "holds the spec, probes before approving" : "none — solo run"),
    blurb: `${s.reason || "running"} · ${s.wallSec ? s.wallSec + "s" : ""} · ${typeof s.costUsd === "number" ? "$" + s.costUsd.toFixed(2) : ""}`
  };
}
const TOOL_TAG = { read:"R", grep:"G", find:"F", ls:"L", write:"W", edit:"E", bash:"B", send_mail:"M" };
const FACETS = [
  { key:"thinking",   label:"COT THOUGHTS" },
  { key:"tool",       label:"TOOL RUNS" },
  { key:"mail",       label:"MAIL EXCH" },
  { key:"delegation", label:"DELEGATION" },
  { key:"oracle",     label:"ORACLE" },
];

let currentId = null;
let timer = null, playing = false, playhead = 0, speed = 4, duration = 1;
let cursor = 0;
const filters = { thinking:true, tool:true, mail:true, delegation:true, oracle:true };
let searchQuery = "";
// Agent-colour lanes generalize past the fixed builder/critic pair: an orchestrator
// run's agents are "orchestrator" and "worker:<id>", one per spawned pi-subagent.
// A worker plays the builder's role (klein/left lane); the orchestrator plays the
// critic's (amber/right lane) — same palette, same "who is acting" convention.
function isBuilderLike(agent){ return agent === "builder" || (typeof agent === "string" && agent.startsWith("worker:")); }
function isCriticLike(agent){ return agent === "critic" || agent === "orchestrator"; }

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mailHtml(text){
  let h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/`([^`]+)`/g, "<code class='bg-stone-950 px-1 border border-stone-800'>$1</code>");
  return h;
}
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s%60;
  return m + ":" + String(r).padStart(2,"0");
}
function fmtCost(c){ return c==null ? "—" : "$"+c.toFixed(2); }

// ---------- sidebar run list ----------
function buildRunList(){
  const wrap = document.getElementById("runList");
  wrap.innerHTML = "";
  for (const id of Object.keys(RUNS)){
    const r = RUNS[id];
    const meta = metaFor(RUNS[id]);
    const b = document.createElement("button");
    b.className = "run-item w-full text-left p-2.5 flex items-center justify-between transition-colors";
    b.dataset.id = id;
    b.innerHTML =
      '<div class="flex flex-col min-w-0"><span class="font-mono text-xs font-bold tracking-tight truncate run-title"></span>' +
      '<span class="font-mono text-[10px] text-stone-500 truncate">'+meta.model+'</span></div>' +
      '<span class="w-1.5 h-1.5 flex-none run-dot"></span>';
    b.querySelector(".run-title").textContent = meta.title;
    b.addEventListener("click", () => selectRun(id));
    wrap.appendChild(b);
  }
}
function paintRunList(){
  document.querySelectorAll(".run-item").forEach((el) => {
    const id = el.dataset.id;
    const selected = id === currentId;
    const complete = RUNS[id].complete;
    el.className = "run-item w-full text-left p-2.5 flex items-center justify-between transition-colors " +
      (selected ? "bg-stone-850 border-l-2 border-klein border-r border-t border-b border-stone-800" : "bg-stone-900 border border-stone-800/60 hover:border-stone-700 opacity-70 hover:opacity-100");
    const dot = el.querySelector(".run-dot");
    dot.className = "w-1.5 h-1.5 flex-none run-dot " + (complete ? "bg-braun-green" : "bg-vermilion animate-pulse");
  });
}

// ---------- top stats strip ----------
function buildStats(){
  const r = RUNS[currentId];
  const meta = metaFor(RUNS[currentId]);
  const s = r.summary;
  const el = document.getElementById("stats");
  const cost = s ? s.costUsd : null;
  const mailN = s ? s.mail : r.events.filter(e=>e.kind==="mail").length;
  const wall = s ? s.wallSec : (r.events.length ? r.events[r.events.length-1].t : 0);
  const toolsB = s ? s.toolCalls.builder : r.events.filter(e=>e.kind==="tool" && e.agent==="builder").length;
  const toolsC = s ? s.toolCalls.critic : r.events.filter(e=>e.kind==="tool" && e.agent==="critic").length;
  const items = [
    { k:"MODEL", v: meta.model },
    { k:"GATE", v: meta.gate },
    { k:"ELAPSED", v: fmtTime(wall) + (r.complete ? "" : "+") },
    { k:"COST", v: fmtCost(cost) },
    { k:"TOOLS", v: (toolsB+toolsC) },
    { k:"MAIL", v: mailN },
    { k:"OUTCOME", v: s ? (s.reason.startsWith("SUCCESS") ? "PASSED" : "STOPPED") : "IN PROGRESS", cls: s ? (s.reason.startsWith("SUCCESS")?"text-braun-green":"text-vermilion") : "text-amber" },
  ];
  el.innerHTML = items.map((it) =>
    '<div class="bg-stone-900 px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">'+
      '<span class="text-stone-500 text-[9px] uppercase tracking-wider">'+it.k+'</span>'+
      '<span class="font-bold '+(it.cls||"text-stone-100")+'">'+it.v+'</span>'+
    '</div>'
  ).join("");
}

// ---------- facets (with live counts) ----------
function buildFacets(){
  const r = RUNS[currentId];
  const counts = { thinking:0, tool:0, mail:0, delegation:0, oracle:0 };
  for (const e of r.events) if (counts[e.kind] !== undefined) counts[e.kind]++;
  const wrap = document.getElementById("facets");
  wrap.innerHTML = FACETS.map((f) => {
    const active = filters[f.key];
    return '<button class="facet-btn px-2 py-1 border flex items-center gap-1.5 transition-colors '+
      (active ? "bg-stone-900/90 border-stone-800 text-stone-200" : "bg-stone-900/40 border-stone-850 text-stone-600") +
      '" data-facet="'+f.key+'">'+
      '<span class="w-1.5 h-1.5 '+(active ? facetColor(f.key) : "bg-stone-700")+'"></span>'+
      '<span>'+f.label+'</span>'+
      '<span class="text-[9px] text-stone-500 bg-stone-950 px-1 border border-stone-850">'+counts[f.key]+'</span>'+
    '</button>';
  }).join("");
  wrap.querySelectorAll(".facet-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.facet;
      filters[key] = !filters[key];
      buildFacets();
      applyFilter(key);
    });
  });
}
function facetColor(key){
  return key === "thinking" ? "bg-amber" : key === "tool" ? "bg-stone-400" : key === "mail" ? "bg-klein-light" : key === "delegation" ? "bg-amber" : "bg-braun-green";
}
function applyFilter(cat){
  document.getElementById("feed").querySelectorAll('[data-cat="'+cat+'"]').forEach((el) => {
    el.hidden = !filters[cat] || !matchesSearch(el);
  });
}
function matchesSearch(el){
  if (!searchQuery) return true;
  return el.textContent.toLowerCase().includes(searchQuery);
}
function applySearch(){
  document.getElementById("feed").querySelectorAll(".event-item").forEach((el) => {
    const cat = el.dataset.cat;
    el.hidden = !filters[cat] || !matchesSearch(el);
  });
}

// ---------- chips / roles ----------
function buildChips(){
  const meta = metaFor(RUNS[currentId]);
  document.getElementById("builderChips").innerHTML = meta.builderTools.map((t)=>
    '<span class="bg-stone-950 border border-stone-800 text-stone-400 px-1.5 py-0.5">'+t+'</span>').join("");
  document.getElementById("criticChips").innerHTML = meta.criticTools.map((t)=>
    '<span class="bg-stone-950 border border-stone-800 text-stone-400 px-1.5 py-0.5">'+t+'</span>').join("");
  document.getElementById("builderRole").textContent = meta.builderRole;
  document.getElementById("criticRole").textContent = meta.criticRole;
  document.getElementById("feedTarget").innerHTML = "Task: <code class='text-stone-100 font-bold bg-stone-950 px-1 border border-stone-800'>"+meta.title+"</code>";
}

// ---------- delivered source (right pane), real content only ----------
function hilite(code, isJson){
  const esc1 = esc(code);
  if (isJson){
    return esc1.replace(/("(?:\\.|[^"\\])*")(\s*:)?|(\btrue\b|\bfalse\b|\bnull\b)|(-?\d+\.?\d*)/g, (m, str, colon, kw, num) => {
      if (str) return '<span class="'+(colon?"code-fn":"code-str")+'">'+str+'</span>'+(colon||"");
      if (kw) return '<span class="code-kw">'+kw+'</span>';
      if (num) return '<span class="code-num">'+num+'</span>';
      return m;
    });
  }
  const KW = /\b(export|function|const|let|var|return|if|else|for|while|new|throw|typeof|import|from|async|await|try|catch|class|extends|of|in|null|undefined|true|false)\b/;
  return esc1.replace(/(\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+\.?\d*\b)|([A-Za-z_$][A-Za-z0-9_$]*)/g,
    (m, com, str, num, word) => {
      if (com) return '<span class="code-com">'+com+'</span>';
      if (str) return '<span class="code-str">'+str+'</span>';
      if (num) return '<span class="code-num">'+num+'</span>';
      if (word && KW.test(word)) return '<span class="code-kw">'+word+'</span>';
      return m;
    });
}
function buildCode(){
  const r = RUNS[currentId];
  const fileEl = document.getElementById("codeFileName");
  const bodyEl = document.getElementById("codeBody");
  fileEl.textContent = r.sourceFile || "—";
  if (!r.source){
    bodyEl.innerHTML = '<div class="text-stone-600 italic p-2">No deliverable written yet.</div>';
    return;
  }
  const isJson = (r.sourceFile || "").endsWith(".json");
  const lines = r.source.split("\n");
  bodyEl.innerHTML = lines.map((line, i) =>
    '<div class="flex items-start gap-3 py-0.5 hover:bg-stone-900/40">'+
    '<span class="text-stone-600 select-none w-7 text-right font-light text-[11px] pt-0.5 flex-none">'+(i+1)+'</span>'+
    '<div class="flex-1 whitespace-pre-wrap break-all">'+(hilite(line, isJson) || "&nbsp;")+'</div></div>'
  ).join("");
}

// ---------- feed rendering ----------
function clearEmpty(){
  const e = document.querySelector("#feed .feed-empty");
  if (e) e.remove();
}
function resetFeed(){
  document.getElementById("feed").innerHTML = '<div class="feed-empty text-stone-600 italic text-xs p-2">— waiting —</div>';
  cursor = 0;
  paintStatus("builder","idle"); paintStatus("critic","idle");
}
function paintStatus(who, status){
  // Only "builder" and "criticStatus" pills exist in the header — an orchestrator
  // run's "orchestrator" / "worker:<id>" agents have no pill of their own to paint.
  const el = document.getElementById(who+"Status");
  if (!el) return;
  el.dataset.status = status;
  el.textContent = status;
  el.className = "status-pill font-mono text-[9px] px-1.5 py-0.5 border " +
    (status === "streaming" ? "border-braun-green text-braun-green bg-braun-greendim" : "border-stone-700 text-stone-400");
}
function agentBadge(agent){
  const color = isBuilderLike(agent) ? "bg-klein text-white shadow-[0_0_8px_rgba(0,85,255,0.35)]" : "bg-amber text-stone-950 shadow-[0_0_8px_rgba(255,183,3,0.35)]";
  const letter = agent && agent[0] ? agent[0].toUpperCase() : "?";
  return '<span class="w-5 h-5 font-mono font-black text-[11px] flex items-center justify-center flex-none '+color+'">'+letter+'</span>';
}
function agentName(agent){
  const cls = isBuilderLike(agent) ? "text-klein-light" : "text-amber";
  return '<span class="font-sans font-black text-xs '+cls+' uppercase tracking-wide">'+esc(String(agent||"").toUpperCase())+'</span>';
}
function row(catClass, html, align){
  const div = document.createElement("div");
  div.className = "event-item " + catClass + " flex flex-col gap-1.5 max-w-[94%]" + (align ? " ml-auto" : "");
  div.innerHTML = html;
  return div;
}

function renderThinking(e){
  clearEmpty();
  const long = e.text.length > 420;
  const body = long ? e.text.slice(0,420) + "…" : e.text;
  const el = row("thinking", "");
  el.dataset.cat = "thinking";
  if (isCriticLike(e.agent)) el.classList.add("ml-auto"); // classList.add("") throws — this crashed the whole render loop on the first builder thought
  el.innerHTML =
    '<div class="flex items-center justify-between font-mono text-[11px] pb-1"><div class="flex items-center gap-2">'+
    agentBadge(e.agent) + agentName(e.agent) +
    '<span class="font-mono text-[9px] bg-stone-950 text-stone-500 border border-stone-850 px-1.5 py-0.5 font-medium">COT</span></div>'+
    '<span class="text-[10px] text-stone-500 font-mono">'+fmtTime(e.t)+'</span></div>'+
    '<div class="bg-stone-950/90 border-l-2 border-stone-700 border-r border-t border-b border-stone-850 p-3 font-sans text-xs text-stone-400 leading-relaxed shadow-md">'+
    '<div class="flex items-center gap-1.5 font-mono text-[10px] text-stone-500 font-bold uppercase tracking-wider mb-1.5">'+
    '<span class="material-symbols-outlined text-[13px]">psychology</span><span>REASONING</span></div>'+
    '<p class="italic leading-relaxed" data-body>"'+esc(body)+'"</p></div>';
  if (long){
    const btn = document.createElement("button");
    btn.className = "font-mono text-[10px] uppercase tracking-wide text-stone-500 hover:text-stone-300 self-start mt-1";
    btn.textContent = "show full thought";
    let expanded = false;
    btn.addEventListener("click", () => {
      expanded = !expanded;
      el.querySelector("[data-body]").textContent = '"' + (expanded ? e.text : body) + '"';
      btn.textContent = expanded ? "show less" : "show full thought";
    });
    el.appendChild(btn);
  }
  el.hidden = !filters.thinking || !matchesSearch(el);
  document.getElementById("feed").appendChild(el);
  scrollFeed();
  paintStatus(e.agent, "streaming");
}

function renderTool(e){
  clearEmpty();
  const isWarn = e.kind === "warn";
  const isLifecycle = e.kind === "lifecycle";
  if (isLifecycle){
    if (/settled/.test(e.text)) paintStatus(e.agent, "settled");
    return;
  }
  const el = row("tools", "");
  el.dataset.cat = "tool";
  const m = /^(\w+)/.exec(e.text);
  const tag = m ? (TOOL_TAG[m[1]] || m[1][0].toUpperCase()) : "·";
  el.innerHTML =
    '<div class="flex items-center justify-between font-mono text-[11px] pb-1"><div class="flex items-center gap-2">'+
    (e.agent ? agentBadge(e.agent) + agentName(e.agent) : '<span class="font-sans font-black text-xs text-stone-400 uppercase tracking-wide">SYSTEM</span>')+
    '</div><span class="text-[10px] text-stone-500 font-mono">'+fmtTime(e.t)+'</span></div>'+
    '<div class="bg-stone-950 border border-stone-850 overflow-hidden shadow-md">'+
    '<div class="bg-stone-900/90 px-3 py-1.5 border-b border-stone-850 flex items-center gap-2 font-mono text-[11px]">'+
    '<span class="text-stone-500 font-black w-4 text-center">'+tag+'</span>'+
    '<span class="text-stone-300 flex-1 truncate '+(isWarn?"text-vermilion":"")+'">'+esc(e.text)+'</span></div></div>';
  el.hidden = !filters.tool || !matchesSearch(el);
  document.getElementById("feed").appendChild(el);
  scrollFeed();
  if (e.agent) paintStatus(e.agent, "streaming");
}

function renderMail(e){
  clearEmpty();
  const long = e.text.length > 420;
  const body = long ? e.text.slice(0,420) + "…" : e.text;
  const html = mailHtml(body);
  const el = row("mail", "", e.from === "critic");
  el.dataset.cat = "mail";
  const other = e.from === "builder" ? "critic" : "builder";
  const kindColor = e.mailKind === "done" ? "bg-braun-greendim text-braun-green border-braun-green/40" : "bg-stone-950 text-stone-400 border-stone-800";
  el.innerHTML =
    '<div class="flex items-center justify-between font-mono text-[11px] pb-1"><div class="flex items-center gap-2">'+
    agentBadge(e.from) + agentName(e.from) +
    '<span class="font-mono text-[10px] bg-stone-950 text-stone-300 px-1.5 py-0.5 border border-stone-800 font-bold flex items-center gap-1.5">'+
    '<span class="'+(e.from==="builder"?"text-klein-light":"text-amber")+'">'+e.from.toUpperCase()+'</span>'+
    '<span class="text-stone-500">→</span><span class="'+(other==="builder"?"text-klein-light":"text-amber")+'">'+other.toUpperCase()+'</span></span></div>'+
    '<span class="text-[10px] text-stone-500 font-mono">#'+e.n+' · '+fmtTime(e.t)+'</span></div>'+
    '<div class="bg-stone-900 border border-stone-800 p-3 space-y-2 shadow-lg">'+
    '<div class="flex items-center justify-between border-b border-stone-800 pb-1.5">'+
    '<span class="font-mono text-[9px] uppercase tracking-wide px-1.5 py-0.5 border '+kindColor+'">'+e.mailKind+'</span>'+
    (e.truncated ? '<span class="font-mono text-[9px] text-vermilion font-bold" title="cut off at the mail size cap">⚑ CUT OFF</span>' : '')+
    '</div><p class="font-sans text-xs text-stone-300 leading-normal whitespace-pre-wrap" data-body>'+html+'</p></div>';
  if (long){
    const btn = document.createElement("button");
    btn.className = "font-mono text-[10px] uppercase tracking-wide text-stone-500 hover:text-stone-300 self-start mt-1";
    btn.textContent = "show full message";
    let expanded = false;
    btn.addEventListener("click", () => {
      expanded = !expanded;
      el.querySelector("[data-body]").innerHTML = mailHtml(expanded ? e.text : body);
      btn.textContent = expanded ? "show less" : "show full message";
    });
    el.appendChild(btn);
  }
  el.hidden = !filters.mail || !matchesSearch(el);
  document.getElementById("feed").appendChild(el);
  scrollFeed();
  paintStatus(e.from, "settled");
  paintStatus(e.to, "streaming");
}

function renderDelegation(e){
  clearEmpty();
  const el = row("delegation", "");
  el.dataset.cat = "delegation";
  const tag = String(e.sub || "").toUpperCase();
  el.innerHTML =
    '<div class="flex items-center justify-between font-mono text-[11px] pb-1"><div class="flex items-center gap-2">'+
    (e.agent ? agentBadge(e.agent) + agentName(e.agent) : '<span class="font-sans font-black text-xs text-stone-400 uppercase tracking-wide">SYSTEM</span>')+
    '</div><span class="text-[10px] text-stone-500 font-mono">'+fmtTime(e.t)+'</span></div>'+
    '<div class="bg-stone-950 border-l-2 border-amber border-t border-r border-b border-stone-850 overflow-hidden shadow-md">'+
    '<div class="bg-stone-900/90 px-3 py-1.5 border-b border-stone-850 flex items-center gap-2 font-mono text-[11px]">'+
    '<span class="text-amber font-black text-[10px] uppercase tracking-wide">'+esc(tag)+'</span>'+
    '<span class="text-stone-300 flex-1 truncate">'+esc(e.text)+'</span></div></div>';
  el.hidden = !filters.delegation || !matchesSearch(el);
  document.getElementById("feed").appendChild(el);
  scrollFeed();
  if (e.agent) paintStatus(e.agent, "streaming");
}

function renderOracle(e){
  clearEmpty();
  const pass = /(\d+)\/\1 passed/.test(e.text) && !/0\/0/.test(e.text);
  const el = row("oracle", "");
  el.dataset.cat = "oracle";
  el.classList.add("bg-stone-950","border","border-stone-800","p-3.5","relative","shadow-xl");
  el.innerHTML =
    '<div class="flex items-center justify-between border-b border-stone-800 pb-2.5">'+
    '<div class="flex items-center gap-2.5"><span class="w-5 h-5 bg-stone-800 text-stone-100 font-mono font-black text-[11px] flex items-center justify-center border border-stone-700">O</span>'+
    '<span class="font-sans text-sm font-black tracking-wider uppercase text-stone-100">SYSTEM / ORACLE GATE</span></div>'+
    '<span class="font-mono text-[10px] font-bold px-2 py-0.5 uppercase tracking-wider '+(pass?"bg-braun-greendim text-braun-green border border-braun-green/40":"bg-vermilion/10 text-vermilion border border-vermilion/40")+'">'+(pass?"PASSED":"NOT YET")+'</span>'+
    '</div><div class="py-2.5 font-sans text-xs text-stone-400 leading-relaxed">'+esc(e.text)+'</div>';
  el.hidden = false;
  document.getElementById("feed").appendChild(el);
  scrollFeed();
}
function scrollFeed(){
  const f = document.getElementById("feed");
  f.scrollTop = f.scrollHeight;
}

function applyEvent(e){
  if (e.kind === "mail") renderMail(e);
  else if (e.kind === "oracle") renderOracle(e);
  else if (e.kind === "thinking") renderThinking(e);
  else if (e.kind === "delegation") renderDelegation(e);
  else renderTool(e);
}

// ---------- playback ----------
function buildScrubMarks(){
  const r = RUNS[currentId];
  const marks = document.getElementById("scrubMarks");
  marks.innerHTML = "";
  for (const e of r.events){
    if (e.kind !== "oracle") continue;
    const pass = /(\d+)\/\1 passed/.test(e.text) && !/0\/0/.test(e.text);
    const pct = duration ? (e.t/duration*100) : 0;
    const m = document.createElement("div");
    m.className = "absolute top-0 bottom-0 w-0.5 " + (pass ? "bg-braun-green" : "bg-vermilion");
    m.style.left = pct + "%";
    marks.appendChild(m);
  }
}
function seekTo(t){
  const r = RUNS[currentId];
  if (t < playhead || cursor === 0) resetFeed();
  playhead = t;
  while (cursor < r.events.length && r.events[cursor].t <= playhead){
    applyEvent(r.events[cursor]);
    cursor++;
  }
  document.getElementById("timeNow").textContent = fmtTime(playhead);
  document.getElementById("scrub").value = Math.round(playhead/duration*1000);
}
function tick(prevT){
  const now = performance.now();
  const dt = (now - prevT)/1000;
  playhead += dt*speed;
  if (playhead >= duration){ playhead = duration; seekTo(playhead); pause(); return; }
  seekTo(playhead);
  timer = requestAnimationFrame(() => tick(now));
}
function play(){
  if (playing) return;
  if (playhead >= duration){ playhead = 0; resetFeed(); }
  playing = true;
  document.getElementById("playIcon").textContent = "pause";
  timer = requestAnimationFrame((t)=>tick(performance.now()));
}
function pause(){
  playing = false;
  document.getElementById("playIcon").textContent = "play_arrow";
  if (timer) cancelAnimationFrame(timer);
}

function selectRun(id){
  pause();
  currentId = id;
  const r = RUNS[id];
  duration = Math.max(1, r.events.length ? r.events[r.events.length-1].t + 3 : 1);
  playhead = 0; cursor = 0;

  paintRunList();
  document.getElementById("runSub").textContent = metaFor(RUNS[id]).blurb;
  document.getElementById("feedFoot").querySelector("span:last-child").textContent =
    r.complete ? "Replay — no live process. Reading a completed run's own log files." : "Replay — this run was still in progress when captured.";
  document.getElementById("outcomeLabel").textContent = r.complete ? (r.summary.reason.startsWith("SUCCESS") ? "ORACLE PASSED" : "STOPPED: " + r.summary.reason) : "IN PROGRESS";

  buildStats(); buildChips(); buildFacets(); buildCode(); resetFeed(); buildScrubMarks();
  document.getElementById("timeTotal").textContent = fmtTime(duration);
  document.getElementById("scrub").value = 0;
  document.getElementById("timeNow").textContent = "0:00";

  play();
}

document.getElementById("playBtn").addEventListener("click", () => playing ? pause() : play());
document.getElementById("scrubStart").addEventListener("click", () => { pause(); seekTo(0); });
document.getElementById("scrubEnd").addEventListener("click", () => { pause(); seekTo(duration); });
document.getElementById("speed").addEventListener("change", (e) => speed = Number(e.target.value));
document.getElementById("scrub").addEventListener("input", (e) => { pause(); seekTo(Number(e.target.value)/1000*duration); });
document.getElementById("searchFilter").addEventListener("input", (e) => { searchQuery = e.target.value.toLowerCase(); applySearch(); });

buildRunList();
selectRun(Object.keys(RUNS)[Object.keys(RUNS).length-1]);
</script>
